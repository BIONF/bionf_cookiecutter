name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Login shell so the activated conda environment is used in each step.
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up environment (micromamba)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          # Override the Python pin from environment.yml for the matrix.
          create-args: >-
            python=${{ matrix.python-version }}
          cache-environment: true

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest
